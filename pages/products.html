<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسباب‌بازی‌ها | گالری سنوبر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--g:#315d48;--d:#203d30;--c:#f7f5ef;--p:#fffefa;--i:#24352d;--m:#7c887f;--l:#e8e8df}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Vazirmatn,Tahoma,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 34px));margin:auto}.top{background:var(--d);color:#fff;text-align:center;padding:9px;font-size:11px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px}.brand small{display:block;font-size:10px;color:var(--m);font-weight:500}.navlinks{display:flex;gap:20px;font-size:12px}.head{padding:26px 0}.head h1{font-size:28px;margin:0 0 7px}.head p{font-size:12px;color:var(--m);margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.filter{border:1px solid var(--l);background:var(--p);padding:8px 12px;border-radius:30px;font-size:10px;cursor:pointer}.filter.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:60px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden}.card img{width:100%;height:230px;object-fit:contain;background:#fff;padding:12px}.info{padding:14px}.info small{color:var(--m);font-size:10px}.info h3{font-size:14px;margin:6px 0}.price{color:var(--g);font-weight:800;font-size:11px}.empty{grid-column:1/-1;text-align:center;background:#fff;padding:35px;border-radius:15px;color:var(--m)}footer{background:var(--d);color:#fff;padding:25px;text-align:center;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.navlinks{gap:9px;font-size:10px}.card img{height:150px}}@media(max-width:420px){.brand{font-size:16px}.head h1{font-size:22px}}
@media(max-width:560px){.nav{height:auto;min-height:64px;gap:10px;flex-wrap:wrap;padding:10px 0}.navlinks{flex-wrap:wrap;justify-content:flex-start;gap:10px!important;font-size:11px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.card img{height:clamp(120px,38vw,165px)!important}.info{padding:10px}.info h3{font-size:12px}}</style><link rel="stylesheet" href="../assets/css/theme-toys.css"></head><body><div class="top">گالری سنوبر · فروشگاه تخصصی اسباب‌بازی</div><header><div class="wrap nav"><a class="brand" href="../index.html">✿ گالری سنوبر<small>دنیای بازی، خلاقیت و لبخند</small></a><nav class="navlinks"><a href="../index.html">خانه</a><a href="category.html">دسته‌بندی‌ها</a><a id="accountPanelLink" href="user-panel.html">پنل کاربری</a></nav></div></header><script>(()=>{const r=sessionStorage.getItem("senobar-demo-role"),a=document.getElementById("accountPanelLink");if(!a)return;if(r==="owner"){a.href="owner.html";a.textContent="پنل مالک"}else if(r==="admin"){a.href="admin-panel.html";a.textContent="پنل ادمین"}else if(r==="user"){a.href="user-panel.html";a.textContent="پنل کاربری"}else{a.href="login.html";a.textContent="ورود / ثبت‌نام"}})();</script><main class="wrap"><div class="head"><h1 id="pageTitle">همه اسباب‌بازی‌ها</h1><p>برای نمایش قیمت و موجودی واقعی، اطلاعات محصول را در پنل مالک تکمیل کن.</p></div><div class="filters" id="filters"></div><div class="grid" id="productList"></div></main><footer>© گالری سنوبر · همراه دنیای بازی و خلاقیت</footer><script src="../assets/js/store-data.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const all=senobarProducts().filter(p=>(p.category||"اسباب‌بازی")==="اسباب‌بازی"),cats=senobarCategories(),params=new URLSearchParams(location.search);let selected=params.get("subcategory")||"";const q=(params.get("q")||"").toLowerCase(),$=id=>document.getElementById(id),money=n=>Number(n)>0?new Intl.NumberFormat("fa-IR").format(n)+" تومان":"قیمت پس از ثبت اطلاعات";
const CART_KEY="senobar-cart-v1",ORDER_KEY="senobar-orders-v1";
const readCart=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){return[]}};
const saveCart=v=>localStorage.setItem(CART_KEY,JSON.stringify(v));
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("filters").innerHTML='<button class="filter" data-cat="">همه</button>'+cats.map(c=>'<button class="filter" data-cat="'+safe(c.name)+'">'+(c.emoji||"")+' '+safe(c.name)+'</button>').join("");
const drawer=document.createElement("aside");drawer.className="sb-cart-drawer";drawer.id="sbCartDrawer";drawer.setAttribute("aria-hidden","true");drawer.innerHTML='<div class="sb-cart-head"><div><strong>سبد خرید شما</strong><small id="sbCartSubtitle">محصولات انتخاب‌شده</small></div><button type="button" class="sb-cart-close" aria-label="بستن سبد خرید">×</button></div><div class="sb-cart-toolbar"><span>اقلام سبد</span><button type="button" id="sbClearCart">خالی کردن سبد</button></div><div class="sb-cart-items" id="sbCartItems"></div><div class="sb-cart-bottom"><div class="sb-cart-total" id="sbCartTotal"></div><form id="sbCheckout" class="sb-checkout"><h3>تکمیل سفارش</h3><div id="sbAccountRequired" class="sb-account-required" hidden>برای خرید ابتدا وارد حساب کاربری‌ات شو یا حساب بساز.<a href="login.html">ساخت حساب / ورود</a></div><div id="sbAccountProfile" class="sb-account-profile" hidden><div class="sb-profile-title">اطلاعات حساب شما</div><div class="sb-profile-grid"><div><small>نام و نام خانوادگی</small><b id="sbProfileName">—</b></div><div><small>شماره موبایل</small><b id="sbProfilePhone">—</b></div><div><small>کد پستی ثبت‌شده</small><b id="sbProfilePostal">—</b></div><div class="sb-profile-address"><small>نشانی فعلی حساب</small><b id="sbProfileAddress">—</b></div></div><label class="sb-address-toggle"><input type="checkbox" id="sbChangeAddress"><span>تمایل به تغییر نشانی و کد پستی دارم</span></label><div id="sbNewAddressBox" hidden><p class="sb-map-instruction">نشانی جدید را روی نقشه انتخاب کن؛ می‌توانی جست‌وجو کنی یا روی نقشه ضربه بزنی.</p><div class="sb-map-search"><input id="sbAddressSearch" type="search" placeholder="جست‌وجوی شهر، خیابان یا محله"><button type="button" id="sbAddressSearchBtn">جست‌وجو</button></div><div id="sbAddressMap" aria-label="نقشه انتخاب نشانی جدید"></div><div id="sbMapAddressResult" class="sb-map-result">هنوز نشانی جدیدی انتخاب نشده است.</div><label>کد پستی جدید<input id="sbNewPostal" inputmode="numeric" maxlength="10" placeholder="کد پستی ۱۰ رقمی"></label><small id="sbMapStatus" class="sb-map-status">برای ادامه، نقطه نشانی را روی نقشه انتخاب کن.</small></div><button type="submit" class="sb-order-submit" id="sbConfirmOrder">تأیید اطلاعات و ثبت درخواست خرید</button><small>اگر نشانی را تغییر ندهی، سفارش با نشانی و کد پستی حساب خودت ثبت می‌شود. پرداخت آنلاین پس از اتصال درگاه و بک‌اند فعال می‌شود.</small></div></form></div>';document.body.appendChild(drawer);
const shade=document.createElement("div");shade.className="sb-cart-shade";shade.id="sbCartShade";document.body.appendChild(shade);
const cartButton=document.createElement("button");cartButton.type="button";cartButton.className="sb-cart-open";cartButton.innerHTML='سبد خرید <b id="sbCartCount">0</b>';document.querySelector(".nav").appendChild(cartButton);
function openCart(){drawer.classList.add("open");shade.classList.add("open");drawer.setAttribute("aria-hidden","false");document.body.classList.add("sb-cart-lock");renderCart();fillAccount();setTimeout(()=>drawer.querySelector(".sb-cart-close").focus(),80)}
function closeCart(){drawer.classList.remove("open");shade.classList.remove("open");drawer.setAttribute("aria-hidden","true");document.body.classList.remove("sb-cart-lock");cartButton.focus()}
cartButton.addEventListener("click",openCart);drawer.querySelector(".sb-cart-close").addEventListener("click",closeCart);shade.addEventListener("click",closeCart);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
function renderCart(){const cart=readCart(),count=cart.reduce((n,x)=>n+x.qty,0);$("sbCartCount").textContent=count;$("sbCartSubtitle").textContent=count+" عدد کالا";$("sbCartItems").innerHTML=cart.length?cart.map(x=>'<div class="sb-cart-row"><img src="'+safe(x.img)+'" alt="" onerror="this.style.display=\'none\'"><div class="sb-cart-meta"><b>'+safe(x.name)+'</b><small>قیمت واحد: '+money(x.price)+'</small><strong class="sb-line-total">'+(Number(x.price)>0?money(Number(x.price)*x.qty):"قیمت نامشخص")+'</strong><div class="sb-qty"><button type="button" aria-label="کاهش تعداد" data-dec="'+x.id+'">−</button><span>'+x.qty+'</span><button type="button" aria-label="افزایش تعداد" data-inc="'+x.id+'">+</button><button type="button" class="sb-remove" data-remove="'+x.id+'">حذف کالا</button></div></div></div>').join(''):'<div class="sb-cart-empty"><span>🛒</span><b>سبد خریدت خالیه</b><p>هنوز محصولی انتخاب نکردی.</p><button type="button" id="sbContinueShopping">مشاهده محصولات</button></div>';const unknown=cart.some(x=>!(Number(x.price)>0));const total=cart.reduce((n,x)=>n+(Number(x.price)>0?Number(x.price)*x.qty:0),0);$("sbCartTotal").innerHTML=cart.length?(unknown?'<div class="sb-total-line"><span>جمع کل</span><b>قیمت بعضی کالاها نامشخص است</b></div>':'<div class="sb-total-line"><span>جمع کل ('+count+' عدد)</span><b>'+money(total)+'</b></div>'):'<div class="sb-total-line"><span>جمع کل</span><b>۰ تومان</b></div>';$("sbCheckout").querySelector("button[type=submit]").disabled=!cart.length||unknown}
$("sbClearCart").addEventListener("click",()=>{if(!readCart().length)return;if(confirm("همه کالاها از سبد حذف شوند؟")){saveCart([]);renderCart()}});
$("sbCartItems").addEventListener("click",e=>{if(e.target.id==="sbContinueShopping"){closeCart();return}const b=e.target.closest("button");if(!b)return;let c=readCart(),id=Number(b.dataset.inc||b.dataset.dec||b.dataset.remove),x=c.find(y=>Number(y.id)===id);if(!x)return;if(b.dataset.remove)c=c.filter(y=>Number(y.id)!==id);else if(b.dataset.inc)x.qty++;else if(b.dataset.dec)x.qty--;if(x&&x.qty<1)c=c.filter(y=>Number(y.id)!==id);saveCart(c);renderCart()});
const checkoutForm=drawer.querySelector("#sbCheckout");
const accountRequired=$("sbAccountRequired"),profileBox=$("sbAccountProfile");
const digitsOnly=v=>String(v||"").replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/\D/g,"");
function currentAccount(){try{return JSON.parse(sessionStorage.getItem("senobar-demo-user")||"null")}catch(_){return null}}
function fillAccount(){const a=currentAccount();const ok=a&&a.firstName&&a.lastName&&a.phone;accountRequired.hidden=!!ok;profileBox.hidden=!ok;if(!ok)return;$("sbProfileName").textContent=[a.firstName,a.lastName].filter(Boolean).join(" ");$("sbProfilePhone").textContent=a.phone||"—";$("sbProfilePostal").textContent=a.postalCode||"ثبت نشده";$("sbProfileAddress").textContent=a.address||"نشانی در حساب ثبت نشده";$("sbConfirmOrder").disabled=!readCart().length||!a.address||!a.postalCode}
let sbMap=null,sbMarker=null,sbSelected=null;
function mapStatus(msg,error=false){$("sbMapStatus").textContent=msg;$("sbMapStatus").classList.toggle("error",error)}
function setMapPoint(lat,lon,address=""){if(sbMarker)sbMarker.setLatLng([lat,lon]);else sbMarker=L.marker([lat,lon],{draggable:true}).addTo(sbMap);sbMarker.off("dragend");sbMarker.on("dragend",e=>{const p=e.target.getLatLng();reverseNewAddress(p.lat,p.lng)});sbSelected={lat,lon,address};$("sbMapAddressResult").textContent=address||"در حال دریافت نشانی از نقشه...";$("sbMapStatus").textContent="مکان انتخاب شد؛ در صورت نیاز نشانگر را جابه‌جا کن."}
async function mapJson(url){const r=await fetch(url,{headers:{Accept:"application/json"}});if(!r.ok)throw Error("map request failed");return r.json()}
async function reverseNewAddress(lat,lon){setMapPoint(lat,lon);mapStatus("در حال دریافت نشانی...");try{let data;try{data=await mapJson("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&zoom=18&addressdetails=1&accept-language=fa")}catch(_){data=await mapJson("https://photon.komoot.io/reverse?lat="+lat+"&lon="+lon+"&lang=fa")}const address=data.display_name||[data.features?.[0]?.properties?.name,data.features?.[0]?.properties?.street,data.features?.[0]?.properties?.city].filter(Boolean).join("، ");sbSelected={lat,lon,address};$("sbMapAddressResult").textContent=address||"نشانی متنی پیدا نشد؛ نقطه روی نقشه ذخیره شد.";mapStatus("نشانی از روی نقشه دریافت شد.")}catch(_){sbSelected={lat,lon,address:""};mapStatus("سرویس نشانی در دسترس نیست؛ نقطه روی نقشه انتخاب شده است.",true)}}
function initAddressMap(){if(sbMap){setTimeout(()=>sbMap.invalidateSize(),100);return}if(!window.L){mapStatus("نقشه بارگذاری نشد؛ صفحه را تازه‌سازی کن.",true);return}sbMap=L.map("sbAddressMap").setView([35.6892,51.389],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(sbMap);sbMap.on("click",e=>reverseNewAddress(e.latlng.lat,e.latlng.lng));setTimeout(()=>sbMap.invalidateSize(),150)}
$("sbChangeAddress").addEventListener("change",e=>{const box=$("sbNewAddressBox");box.hidden=!e.target.checked;if(e.target.checked){initAddressMap();setTimeout(()=>sbMap&&sbMap.invalidateSize(),180)}else{sbSelected=null;$("sbNewPostal").value="";$("sbMapAddressResult").textContent="هنوز نشانی جدیدی انتخاب نشده است."}});
$("sbAddressSearchBtn").addEventListener("click",async()=>{const q=$("sbAddressSearch").value.trim();if(!q){mapStatus("نام شهر یا خیابان را وارد کن.",true);return}mapStatus("در حال جست‌وجو...");try{let data=await mapJson("https://photon.komoot.io/api/?q="+encodeURIComponent(q)+"&lang=fa&limit=5");let f=data.features?.[0];if(!f){const n=await mapJson("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=fa&q="+encodeURIComponent(q));if(n[0]){const lat=+n[0].lat,lon=+n[0].lon;sbMap.setView([lat,lon],17);await reverseNewAddress(lat,lon);return}}if(!f){mapStatus("نتیجه‌ای پیدا نشد؛ عبارت دیگری امتحان کن.",true);return}const lat=+f.geometry.coordinates[1],lon=+f.geometry.coordinates[0];sbMap.setView([lat,lon],17);await reverseNewAddress(lat,lon)}catch(_){mapStatus("جست‌وجوی نقشه انجام نشد؛ دوباره تلاش کن.",true)}});
$("sbAddressSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("sbAddressSearchBtn").click()}});
checkoutForm.addEventListener("submit",e=>{e.preventDefault();const cart=readCart(),account=currentAccount();if(!cart.length){alert("سبد خرید خالی است.");return}if(!account||!account.firstName||!account.lastName||!account.phone){accountRequired.hidden=false;return}if(!account.address||!account.postalCode){alert("اطلاعات نشانی و کد پستی حساب ناقص است؛ ابتدا پروفایل را تکمیل کن.");return}let address=account.address,postalCode=account.postalCode,latitude=account.latitude||"",longitude=account.longitude||"";if($("sbChangeAddress").checked){postalCode=digitsOnly($("sbNewPostal").value);if(!sbSelected){mapStatus("برای ثبت نشانی جدید، حتماً نقطه‌ای روی نقشه انتخاب کن.",true);return}if(!/^\d{10}$/.test(postalCode)){mapStatus("کد پستی جدید باید ۱۰ رقم باشد.",true);$("sbNewPostal").focus();return}if(!sbSelected.address){mapStatus("نشانی متنی هنوز از نقشه دریافت نشده؛ چند لحظه صبر کن یا دوباره نقطه را انتخاب کن.",true);return}address=sbSelected.address;latitude=String(sbSelected.lat);longitude=String(sbSelected.lon)}let orders=[];try{orders=JSON.parse(localStorage.getItem(ORDER_KEY))||[]}catch(_){}orders.push({id:Date.now(),createdAt:new Date().toISOString(),customer:{firstName:account.firstName,lastName:account.lastName,phone:account.phone,address,postalCode,latitude,longitude},items:cart,total:cart.every(x=>Number(x.price)>0)?cart.reduce((n,x)=>n+Number(x.price)*x.qty,0):null,status:"درخواست ثبت‌شده روی همین دستگاه"});localStorage.setItem(ORDER_KEY,JSON.stringify(orders));saveCart([]);renderCart();alert("درخواست خرید با اطلاعات حساب و نشانی تأییدشده ثبت شد. برای ثبت سفارش واقعی و پرداخت، اتصال بک‌اند لازم است.")});
const originalOpenCart=openCart;

function render(){document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.cat===selected));let list=all.filter(p=>(!selected||p.subcategory===selected)&&(!q||p.name.toLowerCase().includes(q)));$("pageTitle").textContent=selected||"همه اسباب‌بازی‌ها";$("productList").innerHTML=list.length?list.map(p=>'<article class="card"><img loading="lazy" src="'+safe(p.img)+'" alt="'+safe(p.name)+'" onerror="this.style.display=\'none\';this.nextElementSibling.insertAdjacentHTML(\'afterbegin\',\'<div class=\\\"product-image-fallback\\\">🧸</div>\')"><div class="info"><small>'+safe(p.subcategory)+'</small><h3>'+safe(p.name)+'</h3><span class="price">'+money(p.price)+'</span><button type="button" class="sb-add-cart" data-add="'+Number(p.id)+'">افزودن به سبد خرید</button></div></article>').join(""):'<div class="empty">در این دسته محصولی ثبت نشده است.</div>'}
$("productList").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(!b)return;const p=all.find(x=>Number(x.id)===Number(b.dataset.add));if(!p)return;let c=readCart(),x=c.find(y=>Number(y.id)===Number(p.id));if(x)x.qty++;else c.push({id:p.id,name:p.name,img:p.img,price:p.price,qty:1});saveCart(c);renderCart();b.textContent="اضافه شد ✓";setTimeout(()=>b.textContent="افزودن به سبد خرید",1100)});
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;selected=b.dataset.cat;history.replaceState(null,"",selected?"?subcategory="+encodeURIComponent(selected):"products.html");render()});render();renderCart();
</script><script src="../assets/js/theme-toys.js"></script></body></html>
