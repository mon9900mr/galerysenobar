function renderCart(){const cart=readCart(),count=cart.reduce((n,x)=>n+x.qty,0);$("sbCartCount").textContent=count;$("sbCartSubtitle").textContent=count+" عدد کالا";$("sbCartItems").innerHTML=cart.length?cart.map(x=>'<div class="sb-cart-row"><img src="'+safe(x.img)+'" alt="" onerror="this.style.display=\'none\'"><div class="sb-cart-meta"><b>'+safe(x.name)+'</b><small>'+(Number(x.discountPercent)>0?'قیمت با تخفیف: '+money(x.price)+' (٪'+safe(x.discountPercent)+' تخفیف)':'قیمت واحد: '+money(x.price))+'</small><strong class="sb-line-total">'+(Number(x.price)>0?money(Number(x.price)*x.qty):"قیمت نامشخص")+'</strong><div class="sb-qty"><button type="button" aria-label="کاهش تعداد" data-dec="'+x.id+'">−</button><span>'+x.qty+'</span><button type="button" aria-label="افزایش تعداد" data-inc="'+x.id+'">+</button><button type="button" class="sb-remove" data-remove="'+x.id+'">حذف کالا</button></div></div></div>').join(''):'<div class="sb-cart-empty"><span>🛒</span><b>سبد خریدت خالیه</b><p>هنوز محصولی انتخاب نکردی.</p><button type="button" id="sbContinueShopping">مشاهده محصولات</button></div>';const unknown=cart.some(x=>!(Number(x.price)>0));const total=cart.reduce((n,x)=>n+(Number(x.price)>0?Number(x.price)*x.qty:0),0);$("sbCartTotal").innerHTML=cart.length?(unknown?'<div class="sb-total-line"><span>جمع کل</span><b>قیمت بعضی کالاها نامشخص است</b></div>':'<div class="sb-total-line"><span>جمع کل ('+count+' عدد)</span><b>'+money(total)+'</b></div>'):'<div class="sb-total-line"><span>جمع کل</span><b>۰ تومان</b></div>';$("sbCheckout").querySelector("button[type=submit]").disabled=!cart.length||unknown}

 return [...new Set(parts)].join("، ");
}
async function reverseNewAddress(lat,lon){setMapPoint(lat,lon);mapStatus("در حال دریافت نشانی...");try{let data;try{data=await mapJson("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat="+lat+"&lon="+lon+"&zoom=18&addressdetails=1&accept-language=fa")}catch(_){data=await mapJson("https://photon.komoot.io/reverse?lat="+lat+"&lon="+lon+"&lang=fa")}const address=readableStreetAddress(data)||"خیابان در نقشه پیدا نشد؛ لطفاً نقطه دقیق‌تری انتخاب کن.";sbSelected={lat,lon,address};$("sbMapAddressResult").textContent=address;mapStatus(address.startsWith("خیابان در نقشه")?"نام خیابان پیدا نشد؛ نقطه انتخاب‌شده ذخیره شد.":"نشانی خیابان از روی نقشه دریافت شد.")}catch(_){sbSelected={lat,lon,address:""};mapStatus("سرویس نشانی در دسترس نیست؛ نقطه روی نقشه انتخاب شده است.",true)}}
function initAddressMap(){if(sbMap){setTimeout(()=>sbMap.invalidateSize(),100);return}if(!window.L){mapStatus("نقشه بارگذاری نشد؛ صفحه را تازه‌سازی کن.",true);return}const account=currentAccount(),lat=Number(account?.latitude),lon=Number(account?.longitude);sbMap=L.map("sbAddressMap").setView(Number.isFinite(lat)&&Number.isFinite(lon)&&lat&&lon?[lat,lon]:[35.6892,51.389],Number.isFinite(lat)&&Number.isFinite(lon)&&lat&&lon?16:11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(sbMap);sbMap.on("click",e=>reverseNewAddress(e.latlng.lat,e.latlng.lng));setTimeout(()=>sbMap.invalidateSize(),150)}
$("sbChangeAddress").addEventListener("change",e=>{const box=$("sbNewAddressBox");box.hidden=!e.target.checked;if(e.target.checked){initAddressMap();setTimeout(()=>{if(sbMap){sbMap.invalidateSize();const a=currentAccount(),lat=Number(a?.latitude),lon=Number(a?.longitude);if(Number.isFinite(lat)&&Number.isFinite(lon)&&lat&&lon)reverseNewAddress(lat,lon)}},220)}else{sbSelected=null;$("sbNewPostal").value="";$("sbAddressSearch").value="";$("sbMapAddressResult").textContent="نشانی ثبت‌شده حساب شما استفاده می‌شود."}});
$("sbAddressSearchBtn").addEventListener("click",async()=>{const q=$("sbAddressSearch").value.trim();if(!q){mapStatus("نام شهر یا خیابان را وارد کن.",true);return}mapStatus("در حال جست‌وجو...");try{let data=await mapJson("https://photon.komoot.io/api/?q="+encodeURIComponent(q)+"&lang=fa&limit=5");let f=data.features?.[0];if(!f){const n=await mapJson("https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&accept-language=fa&q="+encodeURIComponent(q));if(n[0]){const lat=+n[0].lat,lon=+n[0].lon;sbMap.setView([lat,lon],17);await reverseNewAddress(lat,lon);return}}if(!f){mapStatus("نتیجه‌ای پیدا نشد؛ عبارت دیگری امتحان کن.",true);return}const lat=+f.geometry.coordinates[1],lon=+f.geometry.coordinates[0];sbMap.setView([lat,lon],17);await reverseNewAddress(lat,lon)}catch(_){mapStatus("جست‌وجوی نقشه انجام نشد؛ دوباره تلاش کن.",true)}});
$("sbAddressSearch").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("sbAddressSearchBtn").click()}});
checkoutForm.addEventListener("submit",e=>{e.preventDefault();const cart=readCart(),account=currentAccount();if(!cart.length){alert("سبد خرید خالی است.");return}if(!account||!account.firstName||!account.lastName||!account.phone){accountRequired.hidden=false;return}if(!account.address||!account.postalCode){alert("اطلاعات نشانی و کد پستی حساب ناقص است؛ ابتدا پروفایل را تکمیل کن.");return}let address=account.address,postalCode=account.postalCode,latitude=account.latitude||"",longitude=account.longitude||"";if($("sbChangeAddress").checked){postalCode=digitsOnly($("sbNewPostal").value);if(!sbSelected){mapStatus("برای ثبت نشانی جدید، حتماً نقطه‌ای روی نقشه انتخاب کن.",true);return}if(!/^\d{10}$/.test(postalCode)){mapStatus("کد پستی جدید باید ۱۰ رقم باشد.",true);$("sbNewPostal").focus();return}if(!sbSelected.address){mapStatus("نشانی متنی هنوز از نقشه دریافت نشده؛ چند لحظه صبر کن یا دوباره نقطه را انتخاب کن.",true);return}address=sbSelected.address;latitude=String(sbSelected.lat);longitude=String(sbSelected.lon)}let orders=[];try{orders=JSON.parse(localStorage.getItem(ORDER_KEY))||[]}catch(_){}orders.push({id:Date.now(),createdAt:new Date().toISOString(),customer:{firstName:account.firstName,lastName:account.lastName,phone:account.phone,address,postalCode,latitude,longitude},items:cart,total:cart.every(x=>Number(x.price)>0)?cart.reduce((n,x)=>n+Number(x.price)*x.qty,0):null,status:"در انتظار پرداخت",paymentStatus:"پرداخت‌نشده"});localStorage.setItem(ORDER_KEY,JSON.stringify(orders));saveCart([]);renderCart();alert("درخواست خرید با اطلاعات حساب و نشانی تأییدشده ثبت شد. برای ثبت سفارش واقعی و پرداخت، اتصال بک‌اند لازم است.")});
const originalOpenCart=openCart;

function productCard(p){const pct=Math.max(0,Math.min(99,Number(p.discountPercent)||0)),final=effectivePrice(p),badge=pct?'<span class="sale-badge">٪'+safe(pct)+' تخفیف</span>':(p.featured?'<span class="sale-badge featured-badge">ویژه</span>':'');return '<article class="card">'+badge+'<div class="product-media"><img loading="lazy" src="'+safe(p.img)+'" alt="'+safe(p.name)+'" onerror="this.onerror=null;this.hidden=true;this.nextElementSibling.hidden=false"><div class="product-image-fallback" hidden aria-hidden="true"></div></div><div class="info"><small>'+safe(p.subcategory)+'</small><h3>'+safe(p.name)+'</h3>'+(pct?'<div class="discount-prices"><del>'+money(p.price)+'</del><span class="price">'+money(final)+'</span></div>':'<span class="price">'+money(p.price)+'</span>')+'<button type="button" class="sb-add-cart" data-add="'+Number(p.id)+'">افزودن به سبد خرید</button></div></article>'}
function render(){document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.cat===selected));let list=all.filter(p=>(!selected||p.subcategory===selected)&&(!q||p.name.toLowerCase().includes(q)));const featured=list.filter(p=>p.featured||Number(p.discountPercent)>0),regular=list.filter(p=>!p.featured&&!(Number(p.discountPercent)>0));$("pageTitle").textContent=selected||"همه پوشاک زنانه";$("productList").innerHTML=(featured.length?'<section class="special-products"><div class="special-heading"><div><span>پیشنهادهای منتخب نارا کالکشن</span><h2>محصولات ویژه</h2></div><b>ویژه و تخفیف‌دار</b></div><div class="grid">'+featured.map(productCard).join("")+'</div></section>':'')+(regular.length?'<div class="grid">'+regular.map(productCard).join("")+'</div>':'')+(!list.length?'<div class="empty">در این دسته محصولی ثبت نشده است.</div>':'')}
$("productList").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(!b)return;const p=all.find(x=>Number(x.id)===Number(b.dataset.add));if(!p)return;let c=readCart(),x=c.find(y=>Number(y.id)===Number(p.id));if(x)x.qty++;else c.push({id:p.id,name:p.name,img:p.img,price:effectivePrice(p),originalPrice:p.price,discountPercent:Number(p.discountPercent)||0,qty:1});saveCart(c);renderCart();b.textContent="اضافه شد ✓";setTimeout(()=>b.textContent="افزودن به سبد خرید",1100)});
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;selected=b.dataset.cat;history.replaceState(null,"",selected?"?subcategory="+encodeURIComponent(selected):"products.html");render()});render();renderCart();
