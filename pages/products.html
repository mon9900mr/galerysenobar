<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اسباب‌بازی‌ها | گالری سنوبر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--g:#315d48;--d:#203d30;--c:#f7f5ef;--p:#fffefa;--i:#24352d;--m:#7c887f;--l:#e8e8df}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Vazirmatn,Tahoma,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 34px));margin:auto}.top{background:var(--d);color:#fff;text-align:center;padding:9px;font-size:11px}.nav{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:900;font-size:19px}.brand small{display:block;font-size:10px;color:var(--m);font-weight:500}.navlinks{display:flex;gap:20px;font-size:12px}.head{padding:26px 0}.head h1{font-size:28px;margin:0 0 7px}.head p{font-size:12px;color:var(--m);margin:0}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 20px}.filter{border:1px solid var(--l);background:var(--p);padding:8px 12px;border-radius:30px;font-size:10px;cursor:pointer}.filter.active{background:var(--g);color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:60px}.card{background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden}.card img{width:100%;height:230px;object-fit:contain;background:#fff;padding:12px}.info{padding:14px}.info small{color:var(--m);font-size:10px}.info h3{font-size:14px;margin:6px 0}.price{color:var(--g);font-weight:800;font-size:11px}.empty{grid-column:1/-1;text-align:center;background:#fff;padding:35px;border-radius:15px;color:var(--m)}footer{background:var(--d);color:#fff;padding:25px;text-align:center;font-size:10px}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.navlinks{gap:9px;font-size:10px}.card img{height:150px}}@media(max-width:420px){.brand{font-size:16px}.head h1{font-size:22px}}
@media(max-width:560px){.nav{height:auto;min-height:64px;gap:10px;flex-wrap:wrap;padding:10px 0}.navlinks{flex-wrap:wrap;justify-content:flex-start;gap:10px!important;font-size:11px!important}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:9px!important}.card img{height:clamp(120px,38vw,165px)!important}.info{padding:10px}.info h3{font-size:12px}}</style><link rel="stylesheet" href="../assets/css/theme-toys.css"></head><body><div class="top">گالری سنوبر · فروشگاه تخصصی اسباب‌بازی</div><header><div class="wrap nav"><a class="brand" href="../index.html">✿ گالری سنوبر<small>دنیای بازی، خلاقیت و لبخند</small></a><nav class="navlinks"><a href="../index.html">خانه</a><a href="category.html">دسته‌بندی‌ها</a><a id="accountPanelLink" href="user-panel.html">پنل کاربری</a></nav></div></header><script>(()=>{const r=sessionStorage.getItem("senobar-demo-role"),a=document.getElementById("accountPanelLink");if(!a)return;if(r==="owner"){a.href="owner.html";a.textContent="پنل مالک"}else if(r==="admin"){a.href="admin-panel.html";a.textContent="پنل ادمین"}else if(r==="user"){a.href="user-panel.html";a.textContent="پنل کاربری"}else{a.href="login.html";a.textContent="ورود / ثبت‌نام"}})();</script><main class="wrap"><div class="head"><h1 id="pageTitle">همه اسباب‌بازی‌ها</h1><p>برای نمایش قیمت و موجودی واقعی، اطلاعات محصول را در پنل مالک تکمیل کن.</p></div><div class="filters" id="filters"></div><div class="grid" id="productList"></div></main><footer>© گالری سنوبر · همراه دنیای بازی و خلاقیت</footer><script src="../assets/js/store-data.js"></script><script>
const all=senobarProducts().filter(p=>(p.category||"اسباب‌بازی")==="اسباب‌بازی"),cats=senobarCategories(),params=new URLSearchParams(location.search);let selected=params.get("subcategory")||"";const q=(params.get("q")||"").toLowerCase(),$=id=>document.getElementById(id),money=n=>Number(n)>0?new Intl.NumberFormat("fa-IR").format(n)+" تومان":"قیمت پس از ثبت اطلاعات";
const CART_KEY="senobar-cart-v1",ORDER_KEY="senobar-orders-v1";
const readCart=()=>{try{return JSON.parse(localStorage.getItem(CART_KEY))||[]}catch(e){return[]}};
const saveCart=v=>localStorage.setItem(CART_KEY,JSON.stringify(v));
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("filters").innerHTML='<button class="filter" data-cat="">همه</button>'+cats.map(c=>'<button class="filter" data-cat="'+safe(c.name)+'">'+(c.emoji||"")+' '+safe(c.name)+'</button>').join("");
const drawer=document.createElement("aside");drawer.className="sb-cart-drawer";drawer.id="sbCartDrawer";drawer.setAttribute("aria-hidden","true");drawer.innerHTML='<div class="sb-cart-head"><strong>سبد خرید شما</strong><button type="button" class="sb-cart-close" aria-label="بستن">×</button></div><div class="sb-cart-items" id="sbCartItems"></div><div class="sb-cart-total" id="sbCartTotal"></div><form id="sbCheckout" class="sb-checkout"><h3>اطلاعات ثبت سفارش</h3><label>نام و نام خانوادگی<input name="name" required autocomplete="name"></label><label>شماره موبایل<input name="phone" required inputmode="tel" pattern="09[0-9]{9}" placeholder="09xxxxxxxxx"></label><label>نشانی تحویل<textarea name="address" required rows="3"></textarea></label><button type="submit" class="sb-order-submit">ثبت درخواست خرید</button><small>این نسخه درگاه پرداخت آنلاین ندارد؛ درخواست روی همین مرورگر ذخیره می‌شود و هنوز برای فروشگاه ارسال نمی‌شود.</small></form>';document.body.appendChild(drawer);
const shade=document.createElement("div");shade.className="sb-cart-shade";shade.id="sbCartShade";document.body.appendChild(shade);
const cartButton=document.createElement("button");cartButton.type="button";cartButton.className="sb-cart-open";cartButton.innerHTML='سبد خرید <b id="sbCartCount">0</b>';document.querySelector(".nav").appendChild(cartButton);
function openCart(){drawer.classList.add("open");shade.classList.add("open");drawer.setAttribute("aria-hidden","false");document.body.classList.add("sb-cart-lock");renderCart()}
function closeCart(){drawer.classList.remove("open");shade.classList.remove("open");drawer.setAttribute("aria-hidden","true");document.body.classList.remove("sb-cart-lock")}
cartButton.addEventListener("click",openCart);drawer.querySelector(".sb-cart-close").addEventListener("click",closeCart);shade.addEventListener("click",closeCart);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeCart()});
function renderCart(){const cart=readCart();$("sbCartCount").textContent=cart.reduce((n,x)=>n+x.qty,0);$("sbCartItems").innerHTML=cart.length?cart.map(x=>'<div class="sb-cart-row"><img src="'+safe(x.img)+'" alt=""><div class="sb-cart-meta"><b>'+safe(x.name)+'</b><small>'+money(x.price)+'</small><div class="sb-qty"><button type="button" data-dec="'+x.id+'">−</button><span>'+x.qty+'</span><button type="button" data-inc="'+x.id+'">+</button><button type="button" class="sb-remove" data-remove="'+x.id+'">حذف</button></div></div></div>').join(""):'<p class="sb-cart-empty">سبد خرید خالی است. از محصولات یک مورد اضافه کن.</p>';
const unknown=cart.some(x=>!(Number(x.price)>0));const total=cart.reduce((n,x)=>n+(Number(x.price)>0?Number(x.price)*x.qty:0),0);$("sbCartTotal").innerHTML=unknown?'<span>جمع کل پس از تعیین قیمت محصولات مشخص می‌شود.</span>':'<strong>جمع کل: '+money(total)+'</strong>'}
$("sbCartItems").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;let c=readCart(),id=Number(b.dataset.inc||b.dataset.dec||b.dataset.remove),x=c.find(y=>Number(y.id)===id);if(!x)return;if(b.dataset.remove)c=c.filter(y=>Number(y.id)!==id);else if(b.dataset.inc)x.qty++;else if(b.dataset.dec)x.qty--;if(x&&x.qty<1)c=c.filter(y=>Number(y.id)!==id);saveCart(c);renderCart()});
drawer.querySelector("#sbCheckout").addEventListener("submit",e=>{e.preventDefault();const cart=readCart();if(!cart.length){alert("سبد خرید خالی است.");return}const data=Object.fromEntries(new FormData(e.currentTarget).entries());let orders=[];try{orders=JSON.parse(localStorage.getItem(ORDER_KEY))||[]}catch(_){}orders.push({id:Date.now(),createdAt:new Date().toISOString(),customer:data,items:cart,total:cart.every(x=>Number(x.price)>0)?cart.reduce((n,x)=>n+Number(x.price)*x.qty,0):null,status:"درخواست ثبت‌شده روی همین دستگاه"});localStorage.setItem(ORDER_KEY,JSON.stringify(orders));saveCart([]);renderCart();e.currentTarget.reset();alert("درخواست خرید در همین مرورگر ذخیره شد. برای ثبت سفارش واقعی و پرداخت، اتصال بک‌اند فروشگاه لازم است.")});
function render(){document.querySelectorAll(".filter").forEach(b=>b.classList.toggle("active",b.dataset.cat===selected));let list=all.filter(p=>(!selected||p.subcategory===selected)&&(!q||p.name.toLowerCase().includes(q)));$("pageTitle").textContent=selected||"همه اسباب‌بازی‌ها";$("productList").innerHTML=list.length?list.map(p=>'<article class="card"><img loading="lazy" src="'+safe(p.img)+'" alt="'+safe(p.name)+'"><div class="info"><small>'+safe(p.subcategory)+'</small><h3>'+safe(p.name)+'</h3><span class="price">'+money(p.price)+'</span><button type="button" class="sb-add-cart" data-add="'+Number(p.id)+'">افزودن به سبد خرید</button></div></article>').join(""):'<div class="empty">در این دسته محصولی ثبت نشده است.</div>'}
$("productList").addEventListener("click",e=>{const b=e.target.closest("[data-add]");if(!b)return;const p=all.find(x=>Number(x.id)===Number(b.dataset.add));if(!p)return;let c=readCart(),x=c.find(y=>Number(y.id)===Number(p.id));if(x)x.qty++;else c.push({id:p.id,name:p.name,img:p.img,price:p.price,qty:1});saveCart(c);renderCart();b.textContent="اضافه شد ✓";setTimeout(()=>b.textContent="افزودن به سبد خرید",1100)});
$("filters").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;selected=b.dataset.cat;history.replaceState(null,"",selected?"?subcategory="+encodeURIComponent(selected):"products.html");render()});render();renderCart();
</script><script src="../assets/js/theme-toys.js"></script></body></html>
