<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دسته‌بندی‌ها | نارا کالکشن</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--g:#315d48;--d:#203d30;--c:#f7f5ef;--p:#fffefa;--i:#24352d;--m:#7c887f;--l:#e8e8df}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Vazirmatn,Tahoma,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 34px));margin:auto}.top{background:var(--d);color:white;text-align:center;padding:9px;font-size:11px}.nav{height:72px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:19px;font-weight:900}.brand small{display:block;font-size:10px;color:var(--m);font-weight:500}.links{display:flex;gap:18px;font-size:12px}.head{padding:28px 0}.head h1{margin:0 0 7px;font-size:28px}.head p{margin:0;color:var(--m);font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:60px}.tile{background:var(--p);border:1px solid var(--l);border-radius:18px;overflow:hidden;transition:.2s}.tile:hover{transform:translateY(-4px)}.tile img{display:block;width:100%;height:170px;object-fit:cover;object-position:center;background:#e9eee7}.tile .placeholder{height:155px;display:grid;place-items:center;background:linear-gradient(135deg,#e8eee5,#f6eadc);font-size:48px}.tile div{padding:14px}.tile b{font-size:13px}.tile p{font-size:10px;line-height:1.8;color:var(--m);margin:6px 0 0}footer{background:var(--d);color:white;padding:25px;text-align:center;font-size:10px}@media(max-width:750px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.grid{gap:9px}.tile img{height:125px}.tile div{padding:10px}.tile b{font-size:11px}.head h1{font-size:22px}}@media(max-width:560px){.nav{height:auto;min-height:62px;flex-wrap:wrap;gap:8px;padding:10px 0}.links{display:flex;flex-wrap:wrap;gap:10px;font-size:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))!important}.tile img{height:clamp(115px,36vw,145px)!important}}</style><link rel="stylesheet" href="../assets/css/theme-toys.css"></head><body><div class="top">نارا کالکشن · لباس راحتی و خانگی زنانه</div><header><div class="wrap nav"><a class="brand" href="../index.html">N نارا کالکشن<small>استایلی برای درخشیدن تو</small></a><nav class="links"><a href="../index.html">خانه</a><a href="products.html">همه محصولات</a><a id="accountPanelLink" href="user-panel.html">پنل کاربری</a></nav></div></header><script>(()=>{const r=sessionStorage.getItem("senobar-demo-role"),a=document.getElementById("accountPanelLink");if(!a)return;if(r==="owner"){a.href="owner.html";a.textContent="پنل مالک"}else if(r==="admin"){a.href="admin-panel.html";a.textContent="پنل ادمین"}else if(r==="user"){a.href="user-panel.html";a.textContent="پنل کاربری"}else{a.href="login.html";a.textContent="ورود / ثبت‌نام"}})();</script><main class="wrap"><div class="head"><h1>دسته‌بندی پوشاک زنانه</h1><p>از میان گروه‌های مختلف، چیزی را که دوست داری انتخاب کن.</p></div><div class="grid" id="categoryGrid"></div></main><footer> نارا کالکشن</footer><script src="../assets/js/store-data.js"></script><script>
const cats=senobarCategories();
const categoryImages={"ست تیشرت و شلوار راحتی":"https://images.unsplash.com/photo-1551163943-3f6a855d1153?auto=format&fit=crop&w=900&q=85","ست بلوز و شلوار خانگی":"https://images.unsplash.com/photo-1551488831-00ddcb6c6bd3?auto=format&fit=crop&w=900&q=85","تیشرت و تاپ":"https://images.unsplash.com/photo-1503342217505-b0a15ec3261c?auto=format&fit=crop&w=900&q=85","شلوار راحتی":"https://images.unsplash.com/photo-1509631179647-0177331693ae?auto=format&fit=crop&w=900&q=85","لباس خواب و خانگی":"https://images.unsplash.com/photo-1576566588028-4147f3842f27?auto=format&fit=crop&w=900&q=85","هودی و دورس":"https://images.unsplash.com/photo-1556821840-3a63f95609a7?auto=format&fit=crop&w=900&q=85","روبدوشامبر و لباس نخی":"https://images.unsplash.com/photo-1598033129183-c4f50c736f10?auto=format&fit=crop&w=900&q=85"};
const imageFor=c=>c.image||categoryImages[c.name]||categoryImages["ست تیشرت و شلوار راحتی"];
function categoryImageFallback(img){const box=document.createElement("div");box.className="category-image-fallback";box.textContent="";box.setAttribute("role","img");box.setAttribute("aria-label",img.alt||"تصویر دسته‌بندی");img.replaceWith(box)}

document.getElementById("categoryGrid").innerHTML=cats.map(c=>'<a class="tile" href="products.html?subcategory='+encodeURIComponent(c.name)+'"><img loading="lazy" src="'+imageFor(c)+'" alt="'+c.name+'" onerror="categoryImageFallback(this)"><div><b>'+c.name+'</b><p>'+c.desc+'</p></div></a>').join("");
</script><script src="../assets/js/theme-toys.js"></script></body></html>
