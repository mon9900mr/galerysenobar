const all=(JSON.parse(localStorage.getItem("senobar-products")||"null")||sample).filter(p=>(p.category||"اسباب‌بازی")==="اسباب‌بازی").map(p=>({...p,category:"اسباب‌بازی",subcategory:p.subcategory||p.cat||"سایر"}));

const names=actual.length?actual:(fallback[category]||[["سایر محصولات","📦"]].map(x=>x[0]));
const icons=Object.fromEntries((fallback[category]||[]).map(x=>[x[0],x[1]]));
