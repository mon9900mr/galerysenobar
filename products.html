<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f5ef"><title>محصولات | گالری صنوبر</title><link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><style>:root{--ink:#24352d;--green:#315d48;--cream:#f7f5ef;--paper:#fffefa;--muted:#7c887f;--line:#e8e8df;--shadow:0 18px 50px #263b2c12}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif}a{color:inherit;text-decoration:none}.wrap{width:min(1160px,calc(100% - 36px));margin:auto}.topline{background:var(--green);color:white;text-align:center;padding:9px;font-size:12px}header{background:#f7f5eff0;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.nav{height:74px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:900;font-size:20px}.brand small{display:block;font-size:10px;color:var(--muted);font-weight:500}.nav a,.nav button{font:inherit}.navlinks{display:flex;gap:20px;font-size:12px;color:#53645a}.crumb{font-size:12px;color:var(--muted);padding:22px 0}.crumb a{color:var(--green)}.pagehead{padding:18px 0 25px}.pagehead h1{font-size:30px;margin:0 0 8px}.pagehead p{color:var(--muted);font-size:13px;margin:0}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:55px}.tile{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:22px;transition:.2s;box-shadow:0 8px 24px #263b2c08}.tile:hover{transform:translateY(-4px);border-color:#8aa58f;box-shadow:var(--shadow)}.tile .emoji{font-size:35px;display:block;margin-bottom:13px}.tile b{font-size:15px}.tile small{display:block;color:var(--muted);font-size:11px;line-height:1.8;margin-top:6px}.tile .count{display:inline-block;margin-top:13px;color:var(--green);font-weight:800;font-size:11px}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:17px;margin:15px 0 60px}.product{background:var(--paper);border:1px solid var(--line);border-radius:20px;overflow:hidden;transition:.2s}.product:hover{transform:translateY(-4px);box-shadow:var(--shadow)}.prod-img{height:205px;background:#f0f0e9;position:relative}.prod-img img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;top:12px;right:12px;background:#fffefaed;color:var(--green);font-size:10px;border-radius:20px;padding:6px 10px}.prod-info{padding:15px}.type{font-size:10px;color:var(--muted)}.prod-info h3{font-size:14px;margin:6px 0 13px}.prod-bottom{display:flex;align-items:center;justify-content:space-between}.price{font-weight:900;color:var(--green);font-size:13px}.add,.primary{border:0;background:var(--green);color:white;border-radius:11px;padding:10px 15px;cursor:pointer;font:inherit}.add{width:36px;height:36px;font-size:20px;padding:0}.empty{background:var(--paper);padding:35px;border-radius:18px;text-align:center;color:var(--muted);grid-column:1/-1}footer{background:#203d30;color:#f4f3eb;padding:32px 0;text-align:center;font-size:11px;margin-top:30px}@media(max-width:800px){.tiles{grid-template-columns:repeat(2,1fr)}.products{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.nav{height:65px}.brand{font-size:17px}.navlinks{gap:10px;font-size:10px}.pagehead h1{font-size:24px}.tiles{gap:9px}.tile{padding:15px}.prod-img{height:150px}.prod-info{padding:11px}.prod-info h3{font-size:12px}}</style></head><body><div class="topline">گالری صنوبر · خرید آنلاین محصولات متنوع</div><header><div class="wrap nav"><a class="brand" href="index.html">✿ گالری صنوبر<small>خرید آنلاین، ساده و دلنشین</small></a><nav class="navlinks"><a href="index.html">صفحه اصلی</a><a href="index.html#categories">دسته‌بندی‌ها</a><a href="products.html">همه محصولات</a><a href="admin.html">مدیریت</a></nav></div></header><main class="wrap"><div class="crumb"><a href="index.html">خانه</a>　›　محصولات</div><section class="pagehead"><h1>محصولات</h1><p>محصولات این بخش را بررسی کن و انتخابت را انجام بده.</p></section><div class="products" id="productList"></div></main><footer>© گالری صنوبر · همراه انتخاب‌های روزمره شما</footer><script>
const all=(JSON.parse(localStorage.getItem("senobar-products")||"null")||[]).map(p=>({...p,category:p.category||"اسباب‌بازی",subcategory:p.subcategory||p.cat||"سایر"}));
const params=new URLSearchParams(location.search),category=params.get("category"),subcategory=params.get("subcategory"),q=params.get("q")||"";
let list=all.filter(p=>(!category||p.category===category)&&(!subcategory||p.subcategory===subcategory)&&(!q||p.name.toLowerCase().includes(q.toLowerCase())));
const title=subcategory||category||"همه محصولات";
document.querySelector("h1").textContent=title;
document.querySelector(".crumb").innerHTML='<a href="index.html">خانه</a>　›　<a href="index.html#categories">دسته‌بندی‌ها</a>　›　'+title;
const toman=n=>new Intl.NumberFormat("fa-IR").format(n)+" تومان";
document.getElementById("productList").innerHTML=list.length?list.map(p=>'<article class="product"><div class="prod-img"><img loading="lazy" src="'+p.img+'" alt="'+p.name+'"><span class="tag">'+(p.tag||"جدید")+'</span></div><div class="prod-info"><span class="type">'+p.category+' / '+p.subcategory+'</span><h3>'+p.name+'</h3><div class="prod-bottom"><span class="price">'+toman(p.price)+'</span><button class="add" onclick="addToCart('+p.id+')">+</button></div></div></article>').join(""):'<div class="empty">در این دسته هنوز محصولی ثبت نشده است.</div>';
function addToCart(id){const cart=JSON.parse(localStorage.getItem("senobar-cart")||"{}");cart[id]=(cart[id]||0)+1;localStorage.setItem("senobar-cart",JSON.stringify(cart));alert("محصول به سبد خرید اضافه شد.")}</script></body></html>
